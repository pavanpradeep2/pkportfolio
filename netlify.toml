[build]
  # No build command needed for plain HTML/CSS/JS
  command = ""
  
  # Serve the root directory
  publish = "."

[[headers]]
  # Basic security headers for all pages
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
